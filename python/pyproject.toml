[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ai"
version = "0.1.0"
description = "Automated trading research, journal and AI analysis for MT5"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "tzdata",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trading-ai = "trading_ai.cli:main"

[tool.setuptools.packages.find]
include = ["trading_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
