# Trading AI settings. No secrets here: API keys live in .env (not committed).

[broker]
name = "exness"
# Timezone of the broker's MT5 server clock. Exness uses UTC.
# FTMO uses Eastern European time: set "Europe/Athens" there (verify first).
server_timezone = "UTC"
# Leave empty to attach to the MT5 terminal that is already open and logged in.
# Set it when several MT5 terminals are installed, e.g.
# terminal_path = 'C:\Program Files\MetaTrader 5 EXNESS\terminal64.exe'
terminal_path = ""

# Internal name = broker symbol name. Open MT5 → Market Watch to check the
# exact names on your account (Exness demo accounts often add an "m" suffix).
[symbols]
GOLD = "XAUUSDm"
NAS100 = "USTECm"
SPX500 = "US500m"
DOW30 = "US30m"
EURUSD = "EURUSDm"
GBPUSD = "GBPUSDm"
USDJPY = "USDJPYm"
# More indices for the RSI2 mean-reversion strategy
GER40 = "DE30m"
UK100 = "UK100m"
JP225 = "JP225m"
AUS200 = "AUS200m"
FRA40 = "FR40m"
EU50 = "STOXX50m"
HK50 = "HK50m"

[download]
timeframes = ["M15", "H1", "D1"]
years = 5
# Daily bars are small: fetch more history so walk-forward has more test years.
years_d1 = 20

[paths]
# Relative paths are resolved from the project root.
data_dir = "data"
journal_db = "data/journal.db"

# Round-trip trading cost per trade in PRICE units (spread + commission +
# slippage). These are rough estimates: check your account's real spreads and
# commissions, and make them a bit worse rather than better.
[costs]
GOLD = 0.40
NAS100 = 2.0
SPX500 = 0.6
DOW30 = 3.0
EURUSD = 0.00012
GBPUSD = 0.00018
USDJPY = 0.018
# rough, deliberately pessimistic; replace with real spreads when known
GER40 = 3.0
UK100 = 2.0
JP225 = 15.0
AUS200 = 3.0
FRA40 = 2.5
EU50 = 3.0
HK50 = 15.0

# Challenge rules in % of the initial balance. Check the firm's current rules
# before paying for a challenge; they change.
[challenge.phase1]
profit_target = 10.0
max_daily_loss = 5.0
max_total_loss = 10.0
min_trading_days = 4
max_days = 0          # 0 = no time limit

[challenge.phase2]
profit_target = 5.0
max_daily_loss = 5.0
max_total_loss = 10.0
min_trading_days = 4
max_days = 0
